<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ──────────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary Meta ──────────────────────────────────────────────────────── -->
    <title>Djo Coiffe — Réservez votre coupe en ligne</title>
    <meta
      name="description"
      content="Djo Coiffe — Réservez votre coupe de cheveux en ligne. Salon de coiffure professionnel. Réservation rapide, gestion de file d'attente, programme de fidélité."
    />
    <meta name="keywords" content="coiffure, salon, réservation, barbier, Djo Coiffe" />
    <meta name="author" content="Djo Coiffe" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme & PWA ────────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#C59D5F" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Favicon ────────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- ── Apple / iOS ────────────────────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Djo Coiffe" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Open Graph / Facebook ─────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Djo Coiffe" />
    <meta property="og:title" content="Djo Coiffe — Réservez votre coupe en ligne" />
    <meta
      property="og:description"
      content="Réservez votre coupe de cheveux en quelques secondes. Salon de coiffure professionnel avec système de file d'attente et programme de fidélité."
    />
    <meta property="og:url" content="https://djocoiffe.web.app" />
    <meta property="og:image" content="https://djocoiffe.web.app/icons/icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="fr_FR" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Djo Coiffe — Réservez votre coupe en ligne" />
    <meta
      name="twitter:description"
      content="Réservez votre coupe de cheveux en quelques secondes. Application de salon de coiffure professionnelle."
    />
    <meta name="twitter:image" content="https://djocoiffe.web.app/icons/icon-512x512.png" />

    <!-- ── Microsoft / Edge ──────────────────────────────────────────────────── -->
    <meta name="msapplication-TileColor" content="#C59D5F" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- ── Fonts ──────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
